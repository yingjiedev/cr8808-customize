name: Frozen dependency baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify public files, source snapshots and runtime dependencies
        run: python scripts/manage-dependencies.py verify
      - name: Python integrity tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Frontend queue tests
        run: node --test tests/homeproxy-node-ui.test.cjs
      - name: Build approved offline baseline
        run: python scripts/manage-dependencies.py build --output tmp/ci-baseline
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cr8808-baseline-${{ matrix.os }}
          path: |
            tmp/ci-baseline/cr8808-homeproxy-baseline.zip
            tmp/ci-baseline/build-report.json
          if-no-files-found: error
          retention-days: 30
