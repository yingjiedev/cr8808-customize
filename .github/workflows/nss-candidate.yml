name: Build wired NSS candidate

on:
  push:
    branches: ['codex/nss-wired-candidate']
    paths:
      - '.github/workflows/nss-candidate.yml'
      - 'firmware/nss/**'
      - 'scripts/*nss-candidate.py'
      - 'tests/test_nss_candidate.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nss-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GIT_HTTP_LOW_SPEED_LIMIT: 1000
      GIT_HTTP_LOW_SPEED_TIME: 60
      CCACHE_MAXSIZE: 4G
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate public inputs and candidate guards
        run: |
          python scripts/manage-dependencies.py verify
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/homeproxy-node-ui.test.cjs
          dash -n firmware/nss/files/etc/uci-defaults/zzz-cr8808-nss-policy
          dash -n firmware/nss/files/usr/sbin/check-cr8808-nss
      - name: Free runner disk and install Linux build dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git glibc-source libncurses-dev libssl-dev libelf-dev python3-setuptools rsync swig unzip zlib1g-dev file wget curl bc zstd
          df -h /
      - name: Read pinned source revision
        id: lock
        run: |
          python - <<'PY'
          import json, os
          lock = json.load(open('firmware/nss/source-lock.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('commit=' + lock['source']['commit'] + '\n')
          PY
      - name: Checkout exact NSS tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: kuncy7/openwrt-nss-edma
          ref: ${{ steps.lock.outputs.commit }}
          path: tmp/nss-source
          persist-credentials: false
      - name: Stage fixed feeds, low-memory policy and maintained applications
        run: python scripts/prepare-nss-candidate.py --source tmp/nss-source --output tmp/nss-preparation
      - name: Resolve feeds and verify complete configuration
        working-directory: tmp/nss-source
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig
          python ../../scripts/prepare-nss-candidate.py --verify-config .config
          ./scripts/feeds list -fs > feeds.pinned.buildinfo
          python - <<'PY'
          import json, subprocess
          lock = json.load(open('../../firmware/nss/source-lock.json'))
          for feed in lock['feeds']:
              actual = subprocess.check_output(['git', '-C', 'feeds/' + feed['name'], 'rev-parse', 'HEAD'], text=True).strip()
              assert actual == feed['commit'], (feed['name'], actual)
          PY
      - name: Download source packages
        timeout-minutes: 75
        working-directory: tmp/nss-source
        run: |
          mkdir -p ../nss-artifacts/logs
          set -o pipefail
          for attempt in 1 2 3; do
            if timeout --kill-after=30s 20m make download -j2 2>&1 | tee "../nss-artifacts/logs/download-${attempt}.txt"; then
              exit 0
            fi
          done
          exit 1
      - name: Compile complete firmware and matching packages
        working-directory: tmp/nss-source
        run: |
          set -o pipefail
          if ! make -j2 2>&1 | tee ../nss-artifacts/logs/build.txt; then
            make -j1 V=s 2>&1 | tee ../nss-artifacts/logs/build-retry.txt
          fi
      - name: Check images, slot size, manifests and checksums
        run: |
          python scripts/finish-nss-candidate.py --source tmp/nss-source --output tmp/nss-artifacts
          tar -C tmp/nss-source -I 'zstd -T2 -6' -cf tmp/nss-artifacts/matching-packages-and-images.tar.zst bin/targets/qualcommax/ipq50xx bin/packages
          cd tmp/nss-artifacts
          sha256sum ./*.ubi ./*.bin ./*.itb ./*.tar.zst > SHA256SUMS
      - name: Preserve build inputs and diagnostic output
        if: always()
        run: |
          mkdir -p tmp/nss-artifacts
          cp firmware/nss/source-lock.json firmware/nss/cr8808.config tmp/nss-artifacts/
          if [ -f tmp/nss-source/.config ]; then cp tmp/nss-source/.config tmp/nss-artifacts/resolved.config; fi
          for path in tmp/nss-source/feeds.pinned.buildinfo tmp/nss-preparation/preparation-report.json; do
            if [ -f "$path" ]; then cp "$path" tmp/nss-artifacts/; fi
          done
      - name: Upload candidate for review, without publishing or deploying
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cr8808-nss-candidate-${{ github.sha }}
          path: tmp/nss-artifacts/
          retention-days: 30
          if-no-files-found: error
