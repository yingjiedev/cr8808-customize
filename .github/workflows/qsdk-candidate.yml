name: Build pinned QSDK NSS candidate

on:
  push:
    branches: ['codex/qsdk-nss-candidate']
    paths:
      - '.github/workflows/qsdk-candidate.yml'
      - 'firmware/qsdk/**'
      - 'scripts/qsdk_*.py'
      - 'tests/test_qsdk_candidate.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qsdk-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      GIT_HTTP_LOW_SPEED_LIMIT: 1000
      GIT_HTTP_LOW_SPEED_TIME: 60
      CCACHE_MAXSIZE: 3G
      BUILD_JOBS: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - name: Validate inputs and candidate guards
        run: |
          python scripts/manage-dependencies.py verify
          python -m unittest discover -s tests -p 'test_*.py'
          dash -n firmware/qsdk/files/etc/uci-defaults/zzz-cr8808-qsdk-policy
          dash -n firmware/qsdk/files/usr/sbin/check-cr8808-qsdk
      - name: Install host build dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev libelf-dev python3-distutils python3-setuptools rsync swig unzip zlib1g-dev file wget curl bc zstd coccinelle
          df -h /
      - name: Read pinned QSDK inputs
        id: lock
        run: |
          python - <<'PY'
          import json, os
          lock = json.load(open('firmware/qsdk/source-lock.json'))
          cache = lock['reference']['download_archive']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('commit=' + lock['source']['commit'] + '\n')
              out.write('cache_url=' + cache['url'] + '\n')
              out.write('cache_sha256=' + cache['sha256'] + '\n')
          PY
      - name: Checkout exact QSDK source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: hzyitc/openwrt-redmi-ax3000
          ref: ${{ steps.lock.outputs.commit }}
          path: tmp/qsdk-source
          persist-credentials: false
      - name: Stage source pins, public policy and original partition profile
        run: python scripts/qsdk_candidate.py prepare --source tmp/qsdk-source --output tmp/qsdk-preparation
      - name: Checkout exact feeds and resolve configuration
        run: |
          python scripts/qsdk_candidate.py feeds --source tmp/qsdk-source
          cd tmp/qsdk-source
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # Old feeds refresh .config while symbols are still being installed.
          cp ../../firmware/qsdk/cr8808.config .config
          make defconfig
          python ../../scripts/qsdk_candidate.py verify-config .config
          ./scripts/feeds list -fs > feeds.pinned.buildinfo
      - name: Restore pinned source archive and compiler cache
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            tmp/qsdk-reference/dl.tar
            tmp/qsdk-source/.ccache
          key: qsdk-${{ runner.os }}-${{ hashFiles('firmware/qsdk/source-lock.json', 'firmware/qsdk/cr8808.config') }}-${{ github.run_id }}
          restore-keys: qsdk-${{ runner.os }}-${{ hashFiles('firmware/qsdk/source-lock.json', 'firmware/qsdk/cr8808.config') }}-
      - name: Verify and restore historical source downloads
        id: sources
        env:
          QSDK_CACHE_URL: ${{ steps.lock.outputs.cache_url }}
        run: |
          mkdir -p tmp/qsdk-reference tmp/qsdk-artifacts/logs
          if [ -f tmp/qsdk-reference/dl.tar ]; then
            python scripts/qsdk_candidate.py restore-downloads --source tmp/qsdk-source --archive tmp/qsdk-reference/dl.tar
          else
            curl --fail --location --retry 3 --retry-all-errors --continue-at - --connect-timeout 30 --output tmp/qsdk-reference/dl.tar.part "$QSDK_CACHE_URL"
            python scripts/qsdk_candidate.py restore-downloads --source tmp/qsdk-source --archive tmp/qsdk-reference/dl.tar.part
            mv tmp/qsdk-reference/dl.tar.part tmp/qsdk-reference/dl.tar
          fi
      - name: Download additional fixed-recipe sources
        timeout-minutes: 60
        working-directory: tmp/qsdk-source
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if timeout --kill-after=30s 15m make download -j4 2>&1 | tee "../qsdk-artifacts/logs/download-${attempt}.txt"; then
              python ../../scripts/qsdk_candidate.py verify-downloads --source .
              exit 0
            fi
          done
          exit 1
      - name: Compile host tools
        working-directory: tmp/qsdk-source
        run: |
          set -o pipefail
          if ! make -j"$BUILD_JOBS" tools/install 2>&1 | tee ../qsdk-artifacts/logs/tools.txt; then
            make -j1 V=s tools/install 2>&1 | tee ../qsdk-artifacts/logs/tools-retry.txt
          fi
      - name: Compile ARM32 cross compiler
        working-directory: tmp/qsdk-source
        run: |
          set -o pipefail
          if ! make -j"$BUILD_JOBS" toolchain/install 2>&1 | tee ../qsdk-artifacts/logs/toolchain.txt; then
            make -j1 V=s toolchain/install 2>&1 | tee ../qsdk-artifacts/logs/toolchain-retry.txt
          fi
      - name: Compile firmware, matching packages, SDK and ImageBuilder
        working-directory: tmp/qsdk-source
        run: |
          set -o pipefail
          if ! make -j"$BUILD_JOBS" 2>&1 | tee ../qsdk-artifacts/logs/build.txt; then
            make -j1 V=s 2>&1 | tee ../qsdk-artifacts/logs/build-retry.txt
          fi
      - name: Preserve matching build outputs
        run: |
          tar -C tmp/qsdk-source -I 'zstd -T2 -6' -cf tmp/qsdk-artifacts/matching-packages-and-images.tar.zst bin/targets/ipq50xx/arm bin/packages
      - name: Verify compiled NAND, memory, firmware, startup links and slot size
        run: python scripts/qsdk_candidate.py finish --source tmp/qsdk-source --output tmp/qsdk-artifacts
      - name: Save source archive and compiler cache
        if: always() && steps.cache.outcome == 'success' && steps.sources.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            tmp/qsdk-reference/dl.tar
            tmp/qsdk-source/.ccache
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Preserve public inputs, configuration and diagnostics
        if: always()
        run: |
          mkdir -p tmp/qsdk-artifacts
          cp firmware/qsdk/source-lock.json firmware/qsdk/source-cache-manifest.json firmware/qsdk/cr8808.config tmp/qsdk-artifacts/
          if [ -f tmp/qsdk-source/.config ]; then cp tmp/qsdk-source/.config tmp/qsdk-artifacts/resolved.config; fi
          for path in tmp/qsdk-source/feeds.pinned.buildinfo tmp/qsdk-preparation/preparation-report.json; do
            if [ -f "$path" ]; then cp "$path" tmp/qsdk-artifacts/; fi
          done
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          root = Path('tmp/qsdk-artifacts')
          rows = []
          for path in sorted(root.iterdir()):
              if path.is_file() and path.name != 'SHA256SUMS':
                  digest = sha256()
                  with path.open('rb') as stream:
                      for block in iter(lambda: stream.read(1024*1024), b''):
                          digest.update(block)
                  rows.append(digest.hexdigest() + '  ' + path.name + '\n')
          (root/'SHA256SUMS').write_text(''.join(rows))
          PY
      - name: Upload review candidate and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cr8808-qsdk-candidate-${{ github.sha }}
          path: tmp/qsdk-artifacts/
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
