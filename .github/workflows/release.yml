name: Publish verified Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to retry
        required: true
        default: v0.1.0

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify public baseline
        run: python scripts/manage-dependencies.py verify
      - name: Integrity and publishing tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Frontend queue tests
        run: node --test tests/homeproxy-node-ui.test.cjs
      - name: Download and prepare exact Release assets
        run: python scripts/manage-release.py prepare --tag "$RELEASE_TAG" --output tmp/release --download
      - name: Upload to draft, verify every remote digest, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/manage-release.py publish --tag "$RELEASE_TAG" --assets tmp/release/assets
